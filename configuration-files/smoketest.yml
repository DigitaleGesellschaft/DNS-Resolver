---
- name: Smoketest
  hosts: all
  become: false
  gather_facts: false
  vars:
    dns_servers:
      - "{{ ip4_vip_dns1 }}"
      - "{{ ip4_vip_dns2 }}"
      - "[{{ ip6_vip_dns1 }}]"
      - "[{{ ip6_vip_dns2 }}]"
  tasks:
    - name: "Smoketest | kdig"
      vars:
        transports: ["+https", "+tls", "+quic"]
        server: "{{ item.0 }}"
        transport: "{{ item.1 }}"
      loop: "{{ dns_servers | product(transports) | list }}"
      delegate_to: 127.0.0.1
      when: ip4 == ip4_dns1
      changed_when: false
      retries: 3
      delay: 3
      register: smoketest_dig
      until: smoketest_dig.rc == 0 and smoketest_dig['stdout'].startswith('"hello world"')
      ansible.builtin.command:
        argv: ["/usr/bin/kdig", "@{{ server }}", "-tTXT", "txt.4KExSeZORLCU0SDx.test", "+retry=0", "+short", "+stats", "{{ transport }}"]

    # kdig can't do DoH3
    - name: "Smoketest | doh3 curl"
      loop: "{{ dns_servers }}"
      vars:
        doh_host: dns.digitale-gesellschaft.ch
        encoded_dns_request: 1ksBIAABAAAAAAAAA3R4dBA0S0V4U2VaT1JMQ1UwU0R4BHRlc3QAABAAAQ== # txt.4KExSeZORLCU0SDx.test TXT
      delegate_to: 127.0.0.1
      when: ip4 == ip4_dns1
      changed_when: false
      check_mode: false
      retries: 3
      delay: 3
      register: smoketest_curl
      until:
        - smoketest_curl.rc == 0
        - smoketest_curl.stdout.endswith('68656c6c6f20776f726c64') # hello world
      loop_control:
        label: "{{ item }}"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          set -o pipefail;
          /usr/bin/curl -sS -f --http3-only -k --retry 0
          --resolve '{{ doh_host }}:443:{{ item }}'
          -H 'accept: application/dns-message'
          -w '%{stderr}%{http_version} %{response_code} %{time_total}s'
          'https://{{ doh_host }}/dns-query?dns={{ encoded_dns_request }}'
          | xxd -p | tr -d '\n'

    - name: "Smoketest | testssl | async"
      loop:
        - - "testssl"
          - "--categories"
          - "--forward-secrecy"
          - "--protocols"
          - "--server-preference"
          - "--client-simulation"
          - "--grease"
          - "--vulnerabilities"
          - "--overwrite"
          - "--csvfile"
          - "../.github/workflow-fixtures/testssl-results/{{ ip4_vip_dns1 }}_p443.csv"
          - "--ip"
          - "{{ ip4_vip_dns1 }}"
          - "dns.digitale-gesellschaft.ch:443"
        - - "testssl"
          - "--categories"
          - "--forward-secrecy"
          - "--protocols"
          - "--server-preference"
          - "--client-simulation"
          - "--grease"
          - "--vulnerabilities"
          - "--overwrite"
          - "--csvfile"
          - "../.github/workflow-fixtures/testssl-results/{{ ip4_vip_dns1 }}_p853.csv"
          - "--ip"
          - "{{ ip4_vip_dns1 }}"
          - "dns.digitale-gesellschaft.ch:853"
        - - "testssl"
          - "--categories"
          - "--forward-secrecy"
          - "--protocols"
          - "--server-preference"
          - "--client-simulation"
          - "--grease"
          - "--vulnerabilities"
          - "--overwrite"
          - "--csvfile"
          - "../.github/workflow-fixtures/testssl-results/{{ ip4_vip_dns2 }}_p443.csv"
          - "--ip"
          - "{{ ip4_vip_dns2 }}"
          - "dns.digitale-gesellschaft.ch:443"
        - - "testssl"
          - "--categories"
          - "--forward-secrecy"
          - "--protocols"
          - "--server-preference"
          - "--client-simulation"
          - "--grease"
          - "--vulnerabilities"
          - "--overwrite"
          - "--csvfile"
          - "../.github/workflow-fixtures/testssl-results/{{ ip4_vip_dns2 }}_p853.csv"
          - "--ip"
          - "{{ ip4_vip_dns2 }}"
          - "dns.digitale-gesellschaft.ch:853"
      delegate_to: 127.0.0.1
      when: ip4 == ip4_dns1
      changed_when: false
      async: 300
      poll: 0
      register: smoketest_testssl
      ansible.builtin.command:
        argv: "{{ item }}"

    - name: "Smoketest | testssl | poll"
      loop: "{{ smoketest_testssl.results }}"
      loop_control:
        loop_var: "async_result_item"
      delegate_to: 127.0.0.1
      when: ip4 == ip4_dns1
      changed_when: false
      register: async_poll_results
      until: async_poll_results is finished
      failed_when: "async_poll_results.rc > 200"
      retries: 300
      ansible.builtin.async_status:
        jid: "{{ async_result_item.ansible_job_id }}"

    - name: "Smoketest | testssl | cleanup"
      loop:
        - ["/usr/bin/sed", "-i", "/DROWN_hint/d", "./../.github/workflow-fixtures/testssl-results/{{ ip4_vip_dns1 }}_p443.csv"]
        - ["/usr/bin/sed", "-i", "/DROWN_hint/d", "./../.github/workflow-fixtures/testssl-results/{{ ip4_vip_dns1 }}_p853.csv"]
        - ["/usr/bin/sed", "-i", "/DROWN_hint/d", "./../.github/workflow-fixtures/testssl-results/{{ ip4_vip_dns2 }}_p443.csv"]
        - ["/usr/bin/sed", "-i", "/DROWN_hint/d", "./../.github/workflow-fixtures/testssl-results/{{ ip4_vip_dns2 }}_p853.csv"]
      delegate_to: 127.0.0.1
      when: ip4 == ip4_dns1
      changed_when: false
      ansible.builtin.command:
        argv: "{{ item }}"

    - name: "Smoketest | testssl | results up-to-date"
      loop:
        - ["/usr/bin/git", "diff", "--quiet", "./../.github/workflow-fixtures/testssl-results/{{ ip4_vip_dns1 }}_p443.csv"]
        - ["/usr/bin/git", "diff", "--quiet", "./../.github/workflow-fixtures/testssl-results/{{ ip4_vip_dns1 }}_p853.csv"]
        - ["/usr/bin/git", "diff", "--quiet", "./../.github/workflow-fixtures/testssl-results/{{ ip4_vip_dns2 }}_p443.csv"]
        - ["/usr/bin/git", "diff", "--quiet", "./../.github/workflow-fixtures/testssl-results/{{ ip4_vip_dns2 }}_p853.csv"]
      delegate_to: 127.0.0.1
      when: ip4 == ip4_dns1
      changed_when: false
      ansible.builtin.command:
        argv: "{{ item }}"
