---
- name: Prepare resolver
  hosts: all
  become: true
  pre_tasks:
    - name: Update Repository Index
      tags: always
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

- name: Setup resolver
  hosts: all
  become: true
  roles:
    - base
    - high_availability
    - dns_backend
    - dns_frontend
    - web_server
    - monitoring
