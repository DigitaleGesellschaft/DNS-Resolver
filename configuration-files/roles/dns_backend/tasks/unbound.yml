---
- name: Unbound | install
  ansible.builtin.package:
    state: present
    name: unbound

- name: Unbound | increase socket buffer size
  loop:
    - rmem_max
    - wmem_max
  ansible.posix.sysctl:
    name: "net.core.{{ item }}"
    value: "8388608"
    sysctl_set: true
    sysctl_file: /etc/sysctl.d/99-socket-buffer-size.conf
    state: present
    reload: true

- name: Unbound | started
  ansible.builtin.service:
    name: unbound
    state: started

- name: Unbound | control key present
  ansible.builtin.command:
    argv:
      - /usr/sbin/unbound-control-setup
    creates: /etc/unbound/unbound_server.pem

- name: Unbound | generate config file from template
  ansible.builtin.template:
    src: unbound.conf.j2
    dest: /etc/unbound/unbound.conf
    owner: root
    group: unbound
    mode: "0644"
  notify:
    - Restart unbound
