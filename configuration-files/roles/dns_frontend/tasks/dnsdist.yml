---
- name: PowerDNS dnsdist | install
  ansible.builtin.package:
    state: present
    name: dnsdist

- name: PowerDNS dnsdist | check if service certificate available
  ansible.builtin.stat:
    path: "{{ cert_path }}live/{{ host_public }}.{{ domain }}.ecdsa/"
  register: dns_frontend_certificate

- name: "PowerDNS dnsdist | ensure dnsdist is {{ not dns_frontend_certificate.stat.exists | ternary('masked', 'not masked') }}"
  ansible.builtin.systemd_service:
    name: dnsdist
    masked: "{{ not dns_frontend_certificate.stat.exists }}"

- name: PowerDNS dnsdist | generate config file from template
  ansible.builtin.template:
    src: dnsdist.yml.j2
    dest: /etc/dnsdist/dnsdist.yml
    owner: root
    group: _dnsdist
    mode: "0644"
  when: dns_frontend_certificate.stat.exists
  notify:
    - Restart dnsdist

- name: PowerDNS dnsdist | remove legacy config file
  ansible.builtin.file:
    state: absent
    dest: /etc/dnsdist/dnsdist.conf
  when: dns_frontend_certificate.stat.exists
  notify:
    - Restart dnsdist

- name: PowerDNS dnsdist | ensure dnsdist is started
  ansible.builtin.service:
    name: dnsdist
    state: started
  when: dns_frontend_certificate.stat.exists
