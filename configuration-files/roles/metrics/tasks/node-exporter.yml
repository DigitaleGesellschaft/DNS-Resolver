---
- name: Metrics | Node Exporter | Package present
  ansible.builtin.package:
    state: present
    name:
      - prometheus-node-exporter
      - prometheus-node-exporter-collectors

- name: Metrics | Node Exporter | Systemd local system unit directory present
  ansible.builtin.file:
    state: directory
    path: "/usr/local/lib/systemd/system"
    owner: root
    group: root
    mode: "0755"

- name: Metrics | Node Exporter | Systemd needrestart service unit present
  loop:
    - usr/local/lib/systemd/system/prometheus-node-exporter-needrestart.service
    - usr/local/lib/systemd/system/prometheus-node-exporter-needrestart.timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/{{ item }}"
    owner: root
    group: root
    mode: "0644"

- name: Metrics | Node Exporter | Service enabled
  loop:
    - prometheus-node-exporter-needrestart.timer
    - prometheus-node-exporter.service
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    daemon_reload: true
    enabled: true
