---
- name: Let's Encrypt | install
  community.general.snap:
    name: certbot
    classic: true

- name: Let's Encrypt | symlink certbot
  ansible.builtin.file:
    src: "/snap/bin/certbot"
    dest: "/usr/bin/certbot"
    owner: root
    group: root
    state: link

- name: Create cert directory
  ansible.builtin.file:
    path: "{{ cert_path }}live/"
    state: directory
    mode: "0755"

- name: Let's Encrypt | create config dir
  ansible.builtin.file:
    path: "{{ cert_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Let's Encrypt | create config accounts sub dir
  ansible.builtin.file:
    path: "{{ cert_path }}accounts"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Let's Encrypt | create config sub dir
  ansible.builtin.file:
    path: "{{ cert_path }}{{ item.file }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - { file: "archive" }
    - { file: "live" }
    - { file: "renewal" }
    - { file: "renewal-hooks" }

- name: Let's Encrypt | copy cli config
  ansible.builtin.copy:
    src: cli.ini
    dest: "{{ cert_path }}cli.ini"
    owner: root
    group: root
    mode: "0644"

- name: Let's Encrypt | create acme well known dir
  ansible.builtin.file:
    path: /var/run/acme/acme-challenge/.well-known/acme-challenge
    state: directory
    owner: root
    group: root
    mode: "0755"

# To test ACME endpoint functionality:
# curl http://dns.digitale-gesellschaft.ch/.well-known/acme-challenge/check.txt
# curl http://dns1.digitale-gesellschaft.ch/.well-known/acme-challenge/check.txt
# curl http://dns2.digitale-gesellschaft.ch/.well-known/acme-challenge/check.txt
# returns either "this is host dns1" or "this is host dns2"
- name: Let's Encrypt | create test file with hostname to verify acme endpoint
  ansible.builtin.copy:
    dest: "/var/run/acme/acme-challenge/.well-known/acme-challenge/check.txt"
    content: |
      "this is host {{ inventory_hostname }}"

- name: Let's Encrypt | copy deploy hook
  ansible.builtin.copy:
    src: letsencrypt-deploy-hook
    dest: /usr/local/sbin/letsencrypt-deploy-hook
    owner: root
    group: root
    mode: "0755"

- name: Let's Encrypt | generate renewal script from template
  ansible.builtin.template:
    src: letsencrypt-renew.j2
    dest: /usr/local/sbin/letsencrypt-renew
    owner: root
    group: root
    mode: "0755"

- name: Let's Encrypt | create renewal crob job
  ansible.builtin.cron:
    name: "renew certs periodically"
    user: root
    weekday: "3"
    minute: "0"
    hour: "0"
    job: "/usr/local/sbin/letsencrypt-renew"
  when: inventory_hostname == "dns1"

- name: Let's Encrypt | create renewal crob job
  ansible.builtin.cron:
    name: "renew certs periodically"
    user: root
    weekday: "4"
    minute: "0"
    hour: "0"
    job: "/usr/local/sbin/letsencrypt-renew"
  when: inventory_hostname == "dns2"

- name: Let's Encrypt | check if service certificate available
  ansible.builtin.stat:
    path: "{{ cert_path }}live/{{ host_public }}.{{ domain }}.ecdsa"
  register: service_certificate

- name: Create Let's Encrypt Certificates, if not existing
  when: not service_certificate.stat.exists
  block:
    - name: Create Let's Encrypt Certificates
      ansible.builtin.include_tasks: letsencrypt_create.yml
